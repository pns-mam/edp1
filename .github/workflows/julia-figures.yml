# Reusable workflow: run the Julia code of a corrigé (Markdown file) and commit the figures it writes.
# The code blocks (```julia) of <dir>/<md> are extracted in order (tools/julia_blocks.py) and run in <dir>/,
# so the GIF / PNG files that the code writes land next to the Markdown file.
# Figures are pushed to the branch (the PR branch on pull requests). On main, the site workflow
# (pages.yml) is then started, because a push made with GITHUB_TOKEN does not start other workflows.
name: Julia figures (reusable)

on:
  workflow_call:
    inputs:
      dir:
        description: Folder of the TP (for example tp2)
        required: true
        type: string
      md:
        description: Markdown file of the corrigé, in that folder
        required: true
        type: string
      packages:
        description: Julia packages to install, comma separated (for example Plots)
        required: true
        type: string
      xvfb:
        description: Run Julia under a virtual display (needed by GLMakie)
        required: false
        type: boolean
        default: false

jobs:
  figures:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    env:
      GKSwstype: "100"   # GR without display
      BRANCH: ${{ github.head_ref || github.ref_name }}
      DIR: ${{ inputs.dir }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}   # branch of the PR, so that the figures are pushed to it
      - name: Is the corrigé there?
        id: chk
        run: |
          if [ -f "$DIR/${{ inputs.md }}" ]; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "::notice::$DIR/${{ inputs.md }} is not in this repository: nothing to do"; fi
      - uses: julia-actions/setup-julia@v2
        if: steps.chk.outputs.exists == 'true'
        with:
          version: "1"
      - uses: julia-actions/cache@v2
        if: steps.chk.outputs.exists == 'true'
      - name: System libraries for GLMakie
        if: inputs.xvfb && steps.chk.outputs.exists == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 libxrandr2 libxinerama1 libxcursor1 libxi6 libxxf86vm1
      - name: Install the Julia packages
        if: steps.chk.outputs.exists == 'true'
        env:
          PACKAGES: ${{ inputs.packages }}
        run: julia -e 'using Pkg; Pkg.add(String.(split(ARGS[1], ",")))' "$PACKAGES"
      - name: Extract the Julia code
        if: steps.chk.outputs.exists == 'true'
        run: python3 tools/julia_blocks.py "$DIR/${{ inputs.md }}" > "$RUNNER_TEMP/code.jl"
      - name: Run it in the TP folder (writes the figures there)
        if: steps.chk.outputs.exists == 'true'
        working-directory: ${{ inputs.dir }}
        run: |
          if [ "${{ inputs.xvfb }}" = "true" ]; then
            xvfb-run -a -s "-screen 0 1280x1024x24" julia "$RUNNER_TEMP/code.jl"
          else
            julia "$RUNNER_TEMP/code.jl"
          fi
      - name: Commit the figures if they changed
        id: commit
        if: steps.chk.outputs.exists == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- "$DIR"
          if git diff --cached --quiet; then
            echo "figures are up to date"
          else
            git commit -m "$DIR: figures generated by the Julia code of ${{ inputs.md }} (CI)"
            for i in 1 2 3; do
              git pull --rebase origin "$BRANCH" && git push origin "HEAD:$BRANCH" && break
              sleep 5
            done
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Rebuild the site (docs/)
        if: steps.commit.outputs.pushed == 'true' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
